services:
  catkin_ws:
    build:
      context: .
      dockerfile: Dockerfile
    image: uavteam8/catkin_ws:latest
    container_name: uavteam8_catkin_ws
    # Host networking makes mavros/GCS/vrpn discovery on the LAN and talking
    # to other ROS_MASTER_URI machines trivial, matching how this workspace
    # is normally run on the Pi itself.
    network_mode: host
    environment:
      # ROLE picks docker/bashrc.d/uav.sh or gcs.sh (set by ./setup-env.sh).
      # ROS_MASTER_URI here is just the container-level baseline; each
      # interactive shell's `disros` (role-specific) sets the real default —
      # self for the UAV, UAV_IP for the GCS. ROS_IP is left for `disros` to
      # auto-detect via `hostname -I`.
      - ROLE=${ROLE:-gcs}
      - ROS_MASTER_URI=http://${UAV_IP:-localhost}:11311
      - ROS_IP=${ROS_IP:-}
      - UAV_IP=${UAV_IP:-}
      - GCS_IP=${GCS_IP:-}
      - VICON_SERVER_DVP=${VICON_SERVER_DVP:-10.68.42.85}
      # :- keeps compose quiet on headless/SSH sessions where DISPLAY is unset;
      # only the rviz/rqt GUI panes need it.
      - DISPLAY=${DISPLAY:-}
      - QT_X11_NO_MITSHM=1
    volumes:
      # Live-edit source without rebuilding the image; rebuild the image
      # whenever package.xml/CMakeLists dependencies change.
      - ./catkin_ws/src:/home/uavteam8/catkin_ws/src
      - ./catkin_ws/launch:/home/uavteam8/catkin_ws/launch
      # Same idea for the shell helpers (disros, the tmux launchers, the aruco
      # helpers): shadows the copy baked into the image so editing them takes
      # effect in the next shell, no rebuild. Host uid 1000 matches uavteam8.
      - ./docker/bashrc.d:/home/uavteam8/.bashrc.d:ro
      # X11 socket, for rqt_*/rviz GUI tools.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # Uncomment on the UAV for the flight controller's serial port. The Pi's
    # GPIO UART is /dev/ttyAMA1, matching control.launch's fcu_url default;
    # a USB-attached FCU shows up as /dev/ttyUSB0 or /dev/ttyACM0 instead.
    # Check with `ls -l /dev/tty*` before and after plugging it in.
    # devices:
    #   - /dev/ttyAMA1:/dev/ttyAMA1
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    privileged: true
    stdin_open: true
    tty: true
    command: bash
