name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint + setup-env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          shellcheck setup-env.sh docker/entrypoint.sh ci/smoke-test.sh
          shellcheck --shell=bash docker/bashrc.d/*.sh

      - name: setup-env.sh behaviour
        run: |
          set -e
          printf '10.0.0.1\n10.0.0.2\n10.0.0.3\n' | ./setup-env.sh uav
          grep -qx 'ROLE=uav' .env
          grep -qx 'UAV_IP=10.0.0.1' .env
          grep -qx 'VICON_SERVER_DVP=10.0.0.3' .env

          # Regression: the role argument must win over the ROLE already in
          # .env (sourcing .env for defaults used to clobber it), and unedited
          # values must carry over.
          printf '\n\n\n' | ./setup-env.sh gcs
          grep -qx 'ROLE=gcs' .env
          grep -qx 'UAV_IP=10.0.0.1' .env

          # An unknown role is rejected.
          ! ./setup-env.sh bogus

          # With no prior .env, empty answers are refused rather than saved blank.
          rm -f .env
          ! printf '\n\n\n' | ./setup-env.sh uav
          test ! -f .env

  build:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image is ~4.7GB; the default runner image leaves too little room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: uavteam8/catkin_ws:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Smoke test
        run: ./ci/smoke-test.sh uavteam8/catkin_ws:ci
